# HsinCLI uses ~/.hsin/config.toml. Other settings follow upstream defaults.
[features]
multi_agent_v2 = true

# Reasoning levels to offer beyond the ones the catalog advertises.
[model_reasoning_levels]
"gpt-5.6-luna" = ["ultra"]

[hsin]
# "explicit" keeps upstream guidance; "auto" lets parents choose models per task.
subagent_model_selection = "explicit"

[hsin.fork]
allow_all = false
default_turns = 1
max_turns = 3
